# =============================================================================
# PriceHub — HTTP Basic gate over the OpenAPI surface.
# Installed at /etc/nginx/snippets/pricehub-docs.conf and pulled into the
# api.gerami.online vhost with a single `include`.
# -----------------------------------------------------------------------------
# WHY: /docs, /redoc and /openapi.json are served by FastAPI itself and were
# world-readable — the full route list, every query parameter and every response
# schema, to anyone, with no key. The data endpoints themselves were never
# exposed (they answer 401 without X-API-Key), but the map to them was, and
# /openapi.json is that map in machine-readable form.
#
# WHY A REGEX LOCATION: the vhost routes everything through `location /`. A
# regex location is evaluated after prefix matching but WINS over a non-`^~`
# prefix match, so this block takes these four paths regardless of where the
# include sits in the file. It is the only regex location in this vhost, so
# nothing competes with it. The four paths it covers:
#     /docs  ·  /docs/oauth2-redirect  ·  /redoc  ·  /openapi.json
# Swagger UI pulls its own JS/CSS from a CDN, not from us, so there is nothing
# else to let through.
#
# WHY NOT JUST 404 THEM: the reference stays useful to the internal partner
# teams; it just needs a password now.
#
# CREDENTIALS live in /etc/nginx/.htpasswd-pricehub-docs — server-only, 640
# root:www-data, never in git. See deploy/README.md to (re)generate it.
#
# NOTE: proxy_set_header is not inherited from a sibling location, so the proxy
# block is repeated here rather than referenced.
# =============================================================================
location ~ ^/(docs|redoc|openapi\.json)(/|$) {
    auth_basic           "PriceHub API reference";
    auth_basic_user_file /etc/nginx/.htpasswd-pricehub-docs;

    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The reference is not for caches or for framing, authenticated or not.
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY"   always;
}
